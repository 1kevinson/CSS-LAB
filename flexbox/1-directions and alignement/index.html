<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resizable Container - CSS Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-wrapper">
        <div class="lesson-title">
            <p>Directions and Alignment</p>
        </div>
        <div class="resizable-container" id="testContainer">
            <div class="dimensions-display" id="dimensionsDisplay">
                <span id="widthText">Width: 0</span><br>
                <span id="heightText">Height: 0</span>
            </div>

            <div class="content">
                <nav>
                    <ul>
                        <li><a href="">Home</a></li>
                        <li><a href="">About</a></li>
                        <li><a href="">Contact</a></li>
                    </ul>
                </nav>
            </div>

            <!-- #region Resizers -->
            <!-- Right resizer (vertical bar) -->
            <div class="resizer resizer-right" id="rightResizer"></div>
            
            <!-- Bottom resizer (horizontal bar) -->
            <div class="resizer resizer-bottom" id="bottomResizer"></div>
            <!-- #endregion -->
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
