<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resizable Container - CSS Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-wrapper">
        <div class="lesson-title">
            <p>Practice title here</p>
        </div>
        <div class="resizable-container" id="testContainer">
            <div class="content">
        
            </div>

            <div class="resizer resizer-right" id="rightResizer"></div>
            
            <!-- Bottom resizer (horizontal bar) -->
            <div class="resizer resizer-bottom" id="bottomResizer"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
