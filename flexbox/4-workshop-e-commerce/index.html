<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop > Ecommerce</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="page-container">
      <header>
        <h1>Sole & Ankle</h1> 
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </header>
      <div class="content">
        <div class="sidebar">
          <span class="sidebar__breadcrum">Home / Sale / Shoes</span>
          <aside class="sidebar__categories">
            <ul>
              <li><a href="#">Running</a></li>
              <li><a href="#">Casual</a></li>
              <li><a href="#">Formal</a></li>
            </ul>
          </aside>
        </div>

        <div class="product-page">
          <div class="product-page__header"></div>
          <main class="product-page__grid">
            <div class="product-card">
              <img src="https://via.placeholder.com/150" alt="Shoe 1" />
              <h2>Shoe 1</h2>
              <p>$49.99</p>
              <button>Add to Cart</button>
            </div>
            <div class="product-card">
              <img src="https://via.placeholder.com/150" alt="Shoe 2" />
              <h2>Shoe 2</h2>
              <p>$59.99</p>
              <button>Add to Cart</button>
            </div>
            <!-- More product cards... -->
          </main>
        </div>
      </div>

      <footer>
        <p>&copy; 2024 My Shoes Store. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
